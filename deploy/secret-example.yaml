# EXAMPLE ONLY. Every value is a placeholder: never commit real keys. Create the real Secrets from your PKI, for example
#   kubectl -n kafka-proxy create secret tls kafka-schema-guardian-server-tls --cert=proxy.crt --key=proxy.key
# or with cert-manager / External Secrets. The Deployment mounts them read-only; nothing is baked into the image.
#
# 1) Certificate the proxy presents to producers (TLS server). Its SANs must contain the advertised host name
#    kafka-schema-guardian-bootstrap.kafka-proxy.svc.cluster.local (and the short names clients use).
apiVersion: v1
kind: Secret
metadata:
  name: kafka-schema-guardian-server-tls
  namespace: kafka-proxy
type: kubernetes.io/tls
stringData:
  tls.crt: "-----BEGIN CERTIFICATE-----\nREPLACE_ME\n-----END CERTIFICATE-----\n"
  tls.key: "-----BEGIN PRIVATE KEY-----\nREPLACE_ME\n-----END PRIVATE KEY-----\n"
---
# 2) CA that signed the producers' client certificates (mTLS mode only: tls.trust with clientAuth: REQUIRED).
apiVersion: v1
kind: Secret
metadata:
  name: kafka-schema-guardian-client-ca
  namespace: kafka-proxy
type: Opaque
stringData:
  ca.crt: "-----BEGIN CERTIFICATE-----\nREPLACE_ME\n-----END CERTIFICATE-----\n"
---
# 3) CA that signed the Kafka brokers' certificates (Strimzi: copy of my-cluster-cluster-ca-cert, key ca.crt, from the kafka namespace).
apiVersion: v1
kind: Secret
metadata:
  name: kafka-schema-guardian-upstream-ca
  namespace: kafka-proxy
type: Opaque
stringData:
  ca.crt: "-----BEGIN CERTIFICATE-----\nREPLACE_ME\n-----END CERTIFICATE-----\n"
---
# 4) Certificate the proxy presents to the brokers (TLS client / mTLS). Strimzi: a KafkaUser of type tls; copy its Secret
#    (keys user.crt and user.key) from the kafka namespace, renaming the keys to tls.crt and tls.key.
apiVersion: v1
kind: Secret
metadata:
  name: kafka-schema-guardian-upstream-client
  namespace: kafka-proxy
type: kubernetes.io/tls
stringData:
  tls.crt: "-----BEGIN CERTIFICATE-----\nREPLACE_ME\n-----END CERTIFICATE-----\n"
  tls.key: "-----BEGIN PRIVATE KEY-----\nREPLACE_ME\n-----END PRIVATE KEY-----\n"
