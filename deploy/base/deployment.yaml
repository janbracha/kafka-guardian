apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-schema-guardian
  labels:
    app.kubernetes.io/name: kafka-schema-guardian
    app.kubernetes.io/part-of: kafka-schema-guardian
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-schema-guardian
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-schema-guardian
        app.kubernetes.io/part-of: kafka-schema-guardian
    spec:
      serviceAccountName: kafka-schema-guardian
      automountServiceAccountToken: false
      enableServiceLinks: false
      # preStop (10 s) + proxy drain (10 s) + shutdown quiet period/timeout (up to 17 s) must fit into this.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 185
        runAsGroup: 185
        fsGroup: 185
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kafka-schema-guardian
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kafka-schema-guardian
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kafka-schema-guardian
      containers:
        - name: proxy
          # Replaced by the kustomize "images" transformer (make deploy sets it from IMAGE_REGISTRY/IMAGE_REPOSITORY/IMAGE_TAG).
          image: registry.example.com/platform/kafka-schema-guardian:1.1.2
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/kafka-schema-guardian/config/proxy-config.yaml
          env:
            - name: KROXYLICIOUS_LOG_FORMAT
              value: json
            - name: KROXYLICIOUS_APP_LOG_LEVEL
              value: INFO
            - name: JAVA_MAX_MEM_RATIO
              value: "60"
            - name: JAVA_OPTIONS
              value: -XX:+ExitOnOutOfMemoryError
          ports:
            - name: kafka-bootstrap
              containerPort: 9092
            - name: kafka-node-0
              containerPort: 9093
            - name: kafka-node-1
              containerPort: 9094
            - name: kafka-node-2
              containerPort: 9095
            - name: management
              containerPort: 9190
          # Resource defaults suit a few thousand producer connections; see README, "Resources and scaling".
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /livez
              port: management
            periodSeconds: 2
            failureThreshold: 30
          # Ports are only opened after the rules were loaded and validated, so an open bootstrap port means "ready".
          readinessProbe:
            tcpSocket:
              port: kafka-bootstrap
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: proxy-config
              mountPath: /etc/kafka-schema-guardian/config
              readOnly: true
            - name: rules
              mountPath: /etc/kafka-schema-guardian/rules
              readOnly: true
            - name: tls-server
              mountPath: /etc/kafka-schema-guardian/tls/server
              readOnly: true
            - name: tls-client-ca
              mountPath: /etc/kafka-schema-guardian/tls/client-ca
              readOnly: true
            - name: tls-upstream-ca
              mountPath: /etc/kafka-schema-guardian/tls/upstream-ca
              readOnly: true
            - name: tls-upstream-client
              mountPath: /etc/kafka-schema-guardian/tls/upstream-client
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: proxy-config
          configMap:
            name: kafka-schema-guardian-config
        - name: rules
          configMap:
            name: kafka-schema-guardian-rules
        # Optional: only the TLS/mTLS modes read them; a mode that needs a missing file fails at start up instead of running unprotected.
        - name: tls-server
          secret:
            secretName: kafka-schema-guardian-server-tls
            optional: true
            defaultMode: 0440
        - name: tls-client-ca
          secret:
            secretName: kafka-schema-guardian-client-ca
            optional: true
            defaultMode: 0440
        - name: tls-upstream-ca
          secret:
            secretName: kafka-schema-guardian-upstream-ca
            optional: true
            defaultMode: 0440
        - name: tls-upstream-client
          secret:
            secretName: kafka-schema-guardian-upstream-client
            optional: true
            defaultMode: 0440
