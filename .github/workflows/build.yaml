name: build

# Builds and tests the guardian, then publishes to Docker Hub:
#   image  docker.io/<namespace>/kafka-schema-guardian        (linux/amd64 + linux/arm64)
#   chart  oci://registry-1.docker.io/<namespace>/kafka-schema-guardian-chart
#
# Repository secrets:   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN   (Docker Hub -> Account settings -> Personal access tokens, Read & Write)
# Repository variables: DOCKERHUB_NAMESPACE (optional: the Docker Hub user or organisation; defaults to DOCKERHUB_USERNAME)
#                       COSIGN_ENABLED      (optional: "true" signs the image and the chart with Sigstore keyless signing)
#
# When it publishes:
#   push to main/master -> image and chart with the immutable version  <pom version>-g<commit>   (a pre-release for the chart)
#   tag v1.2.3    -> the same, plus the release version 1.2.3 for both (the tag must equal the pom version)
#   pull request  -> everything except the publishing (and no secrets are needed)
#
# Every step that does real work is a `make` target or a plain command, so the file ports to GitLab CI / Azure DevOps.
# Third-party actions are pinned to major versions; pin them to commit SHAs in a locked-down organisation.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REGISTRY: docker.io
  IMAGE_REPOSITORY: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/kafka-schema-guardian

jobs:
  # Compile, unit tests, integration tests (real Kroxylicious + in-VM Kafka broker), static checks, plugin JAR.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile, unit tests, integration tests, Enforcer, Spotless
        run: make verify
      - name: Report failures as annotations
        if: failure()
        run: |
          grep -rhE '<<< (FAILURE|ERROR)!' target/surefire-reports target/failsafe-reports 2>/dev/null | head -20 | while read -r line; do echo "::error::${line}"; done || true
      - name: CycloneDX SBOM of the plugin and its dependencies
        run: ./mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom -DoutputFormat=json
      - name: Collect results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-results
          path: |
            target/kafka-schema-guardian-*.jar
            target/bom.json
            target/surefire-reports
            target/failsafe-reports
          if-no-files-found: warn

  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint, render and package
        run: |
          make helm-lint
          helm template ksg deploy/helm/kafka-schema-guardian-chart --namespace kafka-proxy \
            --set serviceMonitor.enabled=true --set autoscaling.enabled=true > /tmp/helm.yaml
          make helm-package IMAGE_REPOSITORY=example/kafka-schema-guardian IMAGE_TAG=0.0.0-gcheck
      - name: Kustomize render
        run: |
          kubectl kustomize deploy > /tmp/kustomize.yaml
          kubectl kustomize deploy/overlays/tls > /dev/null
          kubectl kustomize deploy/overlays/plaintext > /dev/null
      - name: Validate against the Kubernetes schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /tmp kubeconform
          /tmp/kubeconform -strict -summary -ignore-missing-schemas /tmp/helm.yaml /tmp/kustomize.yaml

  # Image: build, vulnerability scan, SBOM, publish with an immutable tag, optional signature.
  image:
    needs: [verify, manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write # Sigstore keyless signing
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release: ${{ steps.meta.outputs.release }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute the versions
        id: meta
        run: |
          version=$(./mvnw -q -B -ntp org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=project.version -DforceStdout)
          release=false
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            if [[ "${GITHUB_REF_NAME#v}" != "${version}" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match the pom version ${version}"
              exit 1
            fi
            release=true
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          # <version>-g<commit> never moves, and is a valid SemVer pre-release, so it is also usable as the chart version.
          echo "tag=${version}-g$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      # Logging in also avoids the anonymous pull rate limit of Docker Hub for the Maven builder image.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build the image (this runs the unit tests again inside the Dockerfile)
        run: |
          set -o pipefail
          make image IMAGE_REGISTRY=local IMAGE_REPOSITORY=kafka-schema-guardian IMAGE_TAG=${{ steps.meta.outputs.tag }} 2>&1 | tee /tmp/image-build.log
      - name: Show the end of the image build log as an annotation
        if: failure()
        run: |
          msg=$(tail -n 40 /tmp/image-build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=image build::${msg}"

      # The official Trivy image is pinned to a version; no third-party action is involved.
      - name: Vulnerability scan (fails on fixable HIGH/CRITICAL findings)
        run: |
          set -o pipefail
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.1 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            local/kafka-schema-guardian:${{ steps.meta.outputs.tag }} 2>&1 | tee /tmp/trivy.log
      - name: Show the findings as an annotation
        if: failure()
        run: |
          msg=$(grep -E 'CVE-[0-9]+|Total:|\(' /tmp/trivy.log 2>/dev/null | cut -c1-260 | head -50 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=trivy::${msg}"

      - name: SBOM of the image (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: local/kafka-schema-guardian:${{ steps.meta.outputs.tag }}
          format: spdx-json
          output-file: image-sbom.spdx.json
          artifact-name: image-sbom.spdx.json

      # Multi-architecture builds need the buildx container driver, which cannot load images into the local daemon,
      # so it is only set up after the scan above.
      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'
      - uses: docker/setup-buildx-action@v3
        if: github.event_name != 'pull_request'

      # Only reached when everything above succeeded; pull requests never publish.
      - name: Publish the multi-architecture image (linux/amd64, linux/arm64)
        if: github.event_name != 'pull_request'
        id: push
        run: |
          image="${IMAGE_REGISTRY}/${IMAGE_REPOSITORY}"
          make image-push IMAGE_TAG=${{ steps.meta.outputs.tag }}
          if [[ "${{ steps.meta.outputs.release }}" == "true" ]]; then
            docker buildx imagetools create -t "${image}:${{ steps.meta.outputs.version }}" "${image}:${{ steps.meta.outputs.tag }}"
          fi
          digest=$(docker buildx imagetools inspect "${image}:${{ steps.meta.outputs.tag }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "### Image"
            echo "\`docker pull ${image}@${digest}\`"
            echo "Tags: ${{ steps.meta.outputs.tag }} ${{ steps.meta.outputs.release == 'true' && steps.meta.outputs.version || '' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Cosign
        if: github.event_name != 'pull_request' && vars.COSIGN_ENABLED == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign the image by digest (keyless) and attach the SBOM
        if: github.event_name != 'pull_request' && vars.COSIGN_ENABLED == 'true'
        run: |
          ref="${IMAGE_REGISTRY}/${IMAGE_REPOSITORY}@${{ steps.push.outputs.digest }}"
          cosign sign --yes "${ref}"
          cosign attest --yes --type spdxjson --predicate image-sbom.spdx.json "${ref}"

  # Helm chart as an OCI artifact in Docker Hub. It runs only after the image it points at exists.
  chart:
    if: github.event_name != 'pull_request'
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Log in to Docker Hub (Helm registry)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "${DOCKERHUB_TOKEN}" | helm registry login registry-1.docker.io --username "${DOCKERHUB_USERNAME}" --password-stdin

      # Chart version = image tag (<version>-g<commit>); a release tag additionally publishes the plain <version>.
      - name: Package and push the chart
        id: push
        run: |
          push() {
            out=$(make helm-push IMAGE_TAG="$1" CHART_VERSION="$1" 2>&1 | tee /dev/stderr)
            echo "$out" | sed -n 's/^Digest: //p' | tail -n1
          }
          digest=$(push "${{ needs.image.outputs.tag }}")
          if [[ "${{ needs.image.outputs.release }}" == "true" ]]; then
            push "${{ needs.image.outputs.version }}" > /dev/null
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "### Helm chart"
            echo "\`helm install kafka-schema-guardian oci://registry-1.docker.io/${IMAGE_REPOSITORY}-chart --version ${{ needs.image.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check that the published chart can be pulled
        run: helm show chart "oci://registry-1.docker.io/${IMAGE_REPOSITORY}-chart" --version "${{ needs.image.outputs.tag }}"

      - uses: sigstore/cosign-installer@v3
        if: vars.COSIGN_ENABLED == 'true'
      - name: Sign the chart by digest (keyless)
        if: vars.COSIGN_ENABLED == 'true' && steps.push.outputs.digest != ''
        run: cosign sign --yes "registry-1.docker.io/${IMAGE_REPOSITORY}-chart@${{ steps.push.outputs.digest }}"
